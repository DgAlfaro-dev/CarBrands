name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, tests and coverage (>= 70%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --nologo

      # The coverage thresholds (70% lines and branches) are defined in the
      # test project csproj: this step fails if they are not met.
      - name: Test with coverage
        run: dotnet test --no-build --nologo

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/PruebaBackend.Api.Tests/coverage/
